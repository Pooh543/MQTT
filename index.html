<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time MQTT payload</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .max-w-xl {
            background-color: #3e1c52;
        }
        .g{
            background-color: #58455f;
        }
    </style>
</head>
<body class="g text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-xl w-full rounded-2xl shadow-xl p-8 border border-gray-700 relative">
        <h1 class="text-3xl font-bold text-center mb-2 text-indigo-400">MQTT Dashboard</h1>
        <p class="text-center text-slate-400 text-sm mb-8">Real-time data from Python via MQTT</p>

        <div class="flex items-center justify-center gap-2 mb-8 bg-slate-850 p-3 rounded-xl border border-slate-700/50">
            <span class="text-sm text-slate-400">System Status:</span>
            <span id="status" class="px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30">Connecting...</span>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            
            <div id="fire-card" class="col-span-2 bg-gradient-to-br from-emerald-500/10 to-teal-500/10 p-6 rounded-2xl border border-emerald-500/20 text-center">
                <span class="text-sm font-medium text-white-400 block mb-1">Fire Status</span>
                <span id="F-val" class="text-2xl font-extrabold text-emerald-400">--</span>
            </div>

            <div class="bg-gradient-to-br from-blue-500/10 to-indigo-500/10 p-6 rounded-2xl border border-blue-500/20 text-center">
                <span class="text-sm font-medium text-slate-400 block mb-1">X axis</span>
                <span id="X-val" class="text-4xl font-extrabold text-white-500">--</span>
                <span class="text-lg font-bold text-blue-500"> px</span>
            </div>

            <div class="bg-gradient-to-br from-blue-500/10 to-indigo-500/10 p-6 rounded-2xl border border-blue-500/20 text-center">
                <span class="text-sm font-medium text-slate-400 block mb-1">Y axis</span>
                <span id="Y-val" class="text-4xl font-extrabold text-white-500">--</span>
                <span class="text-lg font-bold text-blue-500"> px</span>
            </div>

            <div class="bg-gradient-to-br from-blue-500/10 to-indigo-500/10 p-6 rounded-2xl border border-blue-500/20 text-center">
                <span class="text-sm font-medium text-slate-400 block mb-1">Width</span>
                <span id="W-val" class="text-4xl font-extrabold text-white-500">--</span>
                <span class="text-lg font-bold text-blue-500"> px</span>
            </div>

            <div class="bg-gradient-to-br from-blue-500/10 to-indigo-500/10 p-6 rounded-2xl border border-blue-500/20 text-center">
                <span class="text-sm font-medium text-slate-400 block mb-1">Height</span>
                <span id="H-val" class="text-4xl font-extrabold text-white-500">--</span>
                <span class="text-lg font-bold text-blue-500"> px</span>
            </div>
        </div>

        <div class="flex items-center justify-between border-t border-slate-700/50 pt-4 mt-6">
            <div class="text-xs text-slate-500">
                last updated: <span id="time-val">--:--:--</span>
            </div>
            
            <div class="flex gap-2">
                <button onclick="refreshPage()" class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer">
                    <i class="fa-solid fa-arrow-rotate-right"></i> Refresh
                </button>
                
                <button onclick="sendEmergency()" class="flex items-center gap-2 bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg shadow-red-900/40 transition cursor-pointer">
                    <i class="fa-solid fa-triangle-exclamation"></i> Emergency Alert
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. ตั้งค่าการเชื่อมต่อสำหรับ WebSockets ---
        const mqttConfig = {
            hostname: '52a8285132c9498abff7456d065cf11e.s1.eu.hivemq.cloud',
            port: 8884, 
            protocol: 'wss', 
            path: '/mqtt',
            username: 'oatdekwat', 
            password: 'Oat55555', 
            dataTopic: 'home/sensors/data',      // Topic สำหรับรับค่าเซนเซอร์
            controlTopic: 'home/sensors/control'  // Topic สำหรับส่งคำสั่งควบคุมออกไป
        };

        const statusEl = document.getElementById('status');
        const xEl = document.getElementById('X-val');
        const yEl = document.getElementById('Y-val');
        const wEl = document.getElementById('W-val');
        const hEl = document.getElementById('H-val');
        const fEl = document.getElementById('F-val');
        const timeEl = document.getElementById('time-val');

        // --- 2. เริ่มเชื่อมต่อ MQTT Broker ---
        const connectUrl = `wss://${mqttConfig.hostname}:${mqttConfig.port}${mqttConfig.path}`;
        
        const client = mqtt.connect(connectUrl, {
            username: mqttConfig.username,
            password: mqttConfig.password,
            clientId: 'Web_Dashboard_' + Math.random().toString(16).substr(2, 8)
        });

        // เมื่อเชื่อมต่อสำเร็จ
        client.on('connect', () => {
            statusEl.innerText = "Online";
            statusEl.className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
            
            // สมัครรับข้อมูลจาก Data Topic
            client.subscribe(mqttConfig.dataTopic, (err) => {
                if (!err) {
                    console.log(`Subscribed to ${mqttConfig.dataTopic}`);
                }
            });
        });

        // เมื่อเกิดข้อผิดพลาดในการเชื่อมต่อ
        client.on('error', (err) => {
            console.error('Connection error: ', err);
            statusEl.innerText = "connection error";
            statusEl.className = "px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30";
        });

        // --- 3. เมื่อมีข้อความ (Message) ส่งมาจาก Python ---
        client.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                
                xEl.innerText = data.x;
                yEl.innerText = data.y;
                wEl.innerText = data.w;
                hEl.innerText = data.h;
                timeEl.innerText = data.timestamp;
                
                const fireCard = document.getElementById('fire-card');

                if (data.fire_status === true || data.fire_status === "True") {
                    fEl.innerText = "🔥 Fire Detected!! 🔥";
                    fEl.className = "text-2xl font-extrabold text-white animate-pulse";
                    fireCard.className = "col-span-2 bg-gradient-to-br from-red-500 to-rose-500 p-6 rounded-2xl border border-red-500/20 text-center";
                } else {
                    fEl.innerText = "Stable";
                    fEl.className = "text-2xl font-extrabold text-white-400";
                    fireCard.className = "col-span-2 bg-gradient-to-br from-teal-500/100 to-teal-500/100 p-6 rounded-2xl border border-emerald-500/20 text-center";
                }
                
            } catch (e) {
                console.error("Error parsing MQTT message:", e);
            }
        });

        // --- 4. ฟังก์ชันการทำงานของปุ่มต่าง ๆ ---
        
        // ฟังก์ชันรีเฟรชหน้าเว็บ
        function refreshPage() {
            window.location.reload();
        }

        // ฟังก์ชันปุ่มฉุกเฉินส่งค่า Bool = true ไปยัง MQTT
        function sendEmergency() {
            if (client && client.connected) {
                const payload = JSON.stringify({ emergency: true, timestamp: new Date().toLocaleTimeString() });
                
                // สั่ง Publish ค่าออกไป
                client.publish(mqttConfig.controlTopic, payload, { qos: 1 }, (err) => {
                    if (!err) {
                        alert("🚨 Fire alert sent complete!!!!!");
                    } else {
                        alert("🚨 Error occurred while sending data");
                    }
                });
            } else {
                alert("🚨 The webpage is not connected to the MQTT system at this time");
            }
        }
    </script>
</body>
</html>
